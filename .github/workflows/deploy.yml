name: Backend CI & Immutable Image

on:
  pull_request:
    branches: ["develop"]
    paths:
      - "apps/backend/**"
      - ".github/workflows/deploy.yml"
      - "tools/Deployment/Test-Release-Workflow-Gates.sh"
  push:
    branches: ["develop", "main", "master"]
    paths:
      - "apps/backend/**"
      - ".github/workflows/deploy.yml"
      - "tools/Deployment/Test-Release-Workflow-Gates.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vend-machines-backend

jobs:
  validate:
    name: Validate workflow and backend without publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify release workflow safety gates
        run: bash tools/Deployment/Test-Release-Workflow-Gates.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run backend tests
        run: dotnet test apps/backend/VendingMachines.Api.Tests/VendingMachines.Api.Tests.csproj --configuration Release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend container without publishing
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend/VendingMachines.Api
          file: ./apps/backend/VendingMachines.Api/Dockerfile
          push: false
          tags: vend-machines-backend:verify

  build-and-push:
    name: Publish immutable image candidate
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract immutable image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Build and publish image candidate
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend/VendingMachines.Api
          file: ./apps/backend/VendingMachines.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
