name: Backend CI & Docker Build (GHCR)

on:
  push:
    branches: ["develop", "main", "master"]
    paths:
      - "apps/backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vend-machines-backend

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'develop' }}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend/VendingMachines.Api
          file: ./apps/backend/VendingMachines.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Deploy
        if: success()
        run: |
          if [ -z "${{ secrets.COOLIFY_BACKEND_DEPLOY_WEBHOOK }}" ]; then
            echo "::warning::Secret COOLIFY_BACKEND_DEPLOY_WEBHOOK não configurada ainda. Pulando aviso à VPS."
            exit 0
          fi
          echo "Avisando o Coolify para atualizar o container..."
          RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${{ secrets.COOLIFY_BACKEND_DEPLOY_WEBHOOK }}" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}")
          
          echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:20"; then
            echo "Deploy disparado com sucesso no Coolify!"
          else
            echo "::error::Falha ao disparar deploy no Coolify. Verifique o token e a URL."
            exit 1
          fi
