name: Verify application

on:
  push:
    branches: ["develop", "main", "master", "codex/**"]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "Directory.Build.props"
      - "tools/VendingMachines.Simulator/**"
      - "tools/VendingMachines.EncryptionRotation/**"
      - "tools/Database/**"
      - "tools/Deployment/**"
      - "docs/roadmap-producao.md"
      - "docs/operacao-suporte.md"
      - "docs/backup-restore-rehearsal.md"
      - "docs/deploy-seguro.md"
      - "docs/partial-production-rollout.md"
      - "docs/partial-production-evidence-template.md"
      - "docs/deploy-preflight.sql"
      - "docs/payment-sensitive-data-preflight.sql"
      - "docs/payment-sensitive-data-redaction.sql"
      - "docs/migration-risk-review.json"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vending_test
          POSTGRES_INITDB_ARGS: "-c max_connections=300"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vending_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commit changes for exposed secrets
        env:
          SECRET_SCAN_BEFORE_SHA: ${{ github.event.before }}
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SECRET_SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SECRET_SCAN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/Deployment/Scan-GitChangesForSecrets.sh

      - name: Test secret scan commit range selection
        run: python3 tools/Deployment/test_secret_scan_range.py

      - name: Test read-only telemetry overlap preflight
        run: python -B tools/Deployment/test_validate_telemetry_overlap_readiness.py

      - name: Verify migration impact and recovery review
        run: |
          python -B tools/Deployment/test_check_migration_risk.py
          python -B tools/Deployment/test_bound_migration_lock_wait.py
          python -B tools/Deployment/test_assemble_release_package.py
          python -B tools/Deployment/check_migration_risk.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install pinned EF Core CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-ef --version 10.0.12

      - name: Audit backend dependencies
        run: |
          for project in \
            apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            apps/backend/VendingMachines.Api.Tests/VendingMachines.Api.Tests.csproj \
            apps/backend/TestApp/TestApp.csproj \
            tools/VendingMachines.Simulator/VendingMachines.Simulator.csproj \
            tools/VendingMachines.EncryptionRotation/VendingMachines.EncryptionRotation.csproj; do
            dotnet list "$project" package --vulnerable --include-transitive
          done

      - name: Run backend tests
        env:
          VENDMACHINES_TEST_POSTGRES: "Host=localhost;Port=5432;Database=vending_test;Username=postgres;Password=postgres"
          VENDMACHINES_REQUIRE_TEST_POSTGRES: "true"
        run: dotnet test apps/backend/VendingMachines.Api.Tests/VendingMachines.Api.Tests.csproj --configuration Release

      - name: Generate PostgreSQL release migration segments
        env:
          VENDMACHINES_DESIGNTIME_POSTGRES: "Host=localhost;Port=5432;Database=vending_test;Username=postgres;Password=postgres"
        run: |
          mkdir -p artifacts
          ef="$RUNNER_TEMP/dotnet-tools/dotnet-ef"
          before_session_index=20260715023221_AddTelemetrySessionManagement
          session_index=20260730120000_AddMdbStatusAndAutomaticSession
          before_payment_index=20260926173525_AddWebhookInbox
          payment_index=20260926174359_AddPaymentReconciliationTracking
          before_inventory_mapping_index=20261026083333_AddSessionProductSnapshot
          inventory_mapping_index=20261026091223_IndexInventoryMappingMismatchAlerts
          after_inventory_mapping_index=20261102215805_ClearLegacyTelemetryOwnerRoutingMetadata

          "$ef" migrations script 0 "$before_session_index" --idempotent --configuration Release --no-build \
            --project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --startup-project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --output artifacts/postgresql-migrations-before-session-index.sql
          "$ef" migrations script "$before_session_index" "$session_index" --configuration Release --no-build \
            --project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --startup-project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --output artifacts/postgresql-migration-session-index.sql
          "$ef" migrations script "$session_index" "$before_payment_index" --idempotent --configuration Release --no-build \
            --project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --startup-project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --output artifacts/postgresql-migrations-between-online-indexes.sql
          "$ef" migrations script "$before_payment_index" "$payment_index" --configuration Release --no-build \
            --project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --startup-project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --output artifacts/postgresql-migration-payment-reconciliation-index.sql
          "$ef" migrations script "$payment_index" "$before_inventory_mapping_index" --idempotent --configuration Release --no-build \
            --project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --startup-project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --output artifacts/postgresql-migrations-after-payment-index.sql
          "$ef" migrations script "$before_inventory_mapping_index" "$inventory_mapping_index" --configuration Release --no-build \
            --project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --startup-project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --output artifacts/postgresql-migration-inventory-mapping-index.sql
          "$ef" migrations script "$inventory_mapping_index" "$after_inventory_mapping_index" --idempotent --configuration Release --no-build \
            --project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --startup-project apps/backend/VendingMachines.Api/VendingMachines.Api.csproj \
            --output artifacts/postgresql-migrations-after-inventory-index.sql

      - name: Bound PostgreSQL migration lock waits
        run: python3 tools/Deployment/bound_migration_lock_wait.py artifacts

      - name: Verify backend Docker context and base configuration
        run: python -B tools/Deployment/test_backend_docker_context.py

      - name: Test backend image artifact verifier
        shell: pwsh
        run: ./tools/Deployment/Test-BackendImageArtifactVerifier.ps1

      - name: Test private backend candidate launcher
        run: bash tools/Deployment/Test-Start-PrivateBackendCandidate.sh

      - name: Test candidate image and release package pairing
        run: python3 -m unittest tools/Deployment/test_candidate_artifact_pair.py

      - name: Build backend Docker image without publishing
        run: docker build --build-arg APP_REVISION=${{ github.sha }} --tag vend-machines-backend:verify --file apps/backend/VendingMachines.Api/Dockerfile apps/backend/VendingMachines.Api

      - name: Verify backend runtime image contents and fail-closed configuration
        run: bash tools/Deployment/Test-BackendRuntimeImage.sh vend-machines-backend:verify

      - name: Verify backend image runs as a non-root user
        run: |
          image_user="$(docker image inspect --format '{{.Config.User}}' vend-machines-backend:verify)"
          runtime_uid="$(docker run --rm --entrypoint id vend-machines-backend:verify -u)"
          if [ "$image_user" != "app" ] || [ "$runtime_uid" = "0" ]; then
            echo "::error::A imagem do backend deve executar como o usuário não privilegiado app."
            exit 1
          fi

      - name: Verify previous API overlap while a legacy MDB socket stays connected
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            previous_ref="$PR_BASE_SHA"
          elif [[ "$REF_NAME" == "develop" || "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
            previous_ref="$EVENT_BEFORE_SHA"
          elif git rev-parse --verify origin/develop^{commit} >/dev/null 2>&1; then
            previous_ref="origin/develop"
          else
            previous_ref="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          if [[ -z "$previous_ref" || "$previous_ref" =~ ^0+$ ]]; then
            previous_ref="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          if ! git cat-file -e "${previous_ref}^{commit}"; then
            echo "::error::Não foi possível resolver o binário anterior para o ensaio de sobreposição."
            exit 1
          fi
          python tools/Database/Test-PreviousBackendRollbackCompatibility.py \
            --segments artifacts \
            --previous-ref "$previous_ref" \
            --candidate-image vend-machines-backend:verify \
            --postgres-image postgres:17-alpine

      - name: Verify isolated PostgreSQL backup restore utility
        shell: pwsh
        run: ./tools/Database/Test-PostgresBackupRestore.ps1 -PostgresImage postgres:17-alpine

      - name: Verify isolated PostgreSQL migration rehearsal utility
        shell: pwsh
        run: ./tools/Database/Test-PostgresMigrationRehearsal.ps1 -PostgresImage postgres:17-alpine

      - name: Test session admission pause and resume scripts
        shell: pwsh
        run: ./tools/Database/Test-SessionAdmissionScripts.ps1 -PostgresImage postgres:17-alpine

      - name: Test Coolify deployment completion and readiness gates
        run: bash tools/Deployment/Test-Coolify-Deployment.sh

      - name: Verify production workflow release gates
        run: bash tools/Deployment/Test-Release-Workflow-Gates.sh

      - name: Build telemetry simulator
        run: dotnet build tools/VendingMachines.Simulator/VendingMachines.Simulator.csproj --configuration Release

      - name: Build encryption rotation tool
        run: dotnet build tools/VendingMachines.EncryptionRotation/VendingMachines.EncryptionRotation.csproj --configuration Release

      - name: Assemble verified candidate release package
        run: python3 tools/Deployment/assemble_release_package.py --segments-directory artifacts --package-directory artifacts/release-package --source-sha "$GITHUB_SHA"

      - name: Upload verified candidate release package
        uses: actions/upload-artifact@v4
        with:
          name: candidate-release-package-${{ github.sha }}
          path: artifacts/release-package/
          if-no-files-found: error
          retention-days: 14

      - name: Export verified backend image artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_ref="vend-machines-backend:${SOURCE_SHA}"
          output_directory="artifacts/backend-image"
          mkdir -p "$output_directory"
          docker tag vend-machines-backend:verify "$image_ref"
          docker image inspect --format '{{.Id}}' "$image_ref" > "$output_directory/image-id.txt"
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_ref" > "$output_directory/platform.txt"
          printf '%s\n' "$SOURCE_SHA" > "$output_directory/source-sha.txt"
          printf '%s\n' "$image_ref" > "$output_directory/image-ref.txt"
          cp tools/Deployment/Verify-BackendImageArtifact.ps1 "$output_directory/Verify-BackendImageArtifact.ps1"
          cp tools/Deployment/start-private-backend-candidate.sh "$output_directory/start-private-backend-candidate.sh"
          cp tools/Deployment/verify-candidate-artifact-pair.py "$output_directory/verify-candidate-artifact-pair.py"
          chmod 755 "$output_directory/start-private-backend-candidate.sh"
          printf '%s\n' \
            'Este artefato contém somente a imagem backend verificada. Ele não inicia container nem altera serviço.' \
            'A configuração, os segredos e os dados de runtime não são incluídos; injete-os somente no ambiente isolado da candidata.' \
            'Em Windows, antes de carregar, execute: ./Verify-BackendImageArtifact.ps1 -ArtifactPath . -ExpectedSourceSha <SHA completo>.' \
            'Confirme que imagem e migrations correspondem ao mesmo SHA: python3 ./verify-candidate-artifact-pair.py --image-artifact-dir <diretório da imagem> --release-package-dir <diretório do pacote operacional> --expected-source-sha <SHA completo>.' \
            'Em um host Linux Docker, após preflight SQL, backup restaurável e aplicação aprovada das migrations, inicie em loopback com bash ./start-private-backend-candidate.sh --artifact-dir . --release-package-dir <diretório do pacote operacional do mesmo SHA> --expected-source-sha <SHA completo> --docker-network <rede privada> --runtime-env-file <arquivo privado> --legacy-api-origin http://<api antiga privada>:8080.' \
            > "$output_directory/README.txt"
          docker save "$image_ref" | gzip --no-name -1 > "$output_directory/backend-image.tar.gz"
          gzip -t "$output_directory/backend-image.tar.gz"
          (
            cd "$output_directory"
            sha256sum backend-image.tar.gz image-id.txt image-ref.txt platform.txt source-sha.txt README.txt Verify-BackendImageArtifact.ps1 start-private-backend-candidate.sh verify-candidate-artifact-pair.py > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          pwsh tools/Deployment/Verify-BackendImageArtifact.ps1 -ArtifactPath "$output_directory" -ExpectedSourceSha "$SOURCE_SHA"
          python3 tools/Deployment/verify-candidate-artifact-pair.py --image-artifact-dir "$output_directory" --release-package-dir artifacts/release-package --expected-source-sha "$SOURCE_SHA"

      - name: Upload verified backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-backend-image-${{ github.sha }}
          path: artifacts/backend-image/
          if-no-files-found: error
          retention-days: 14

  frontend-checks:
    name: Frontend types, lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend changes against the release base
        id: frontend-target
        env:
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            base_ref="$PR_BASE_SHA"
          elif [[ "$REF_NAME" == "develop" || "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
            base_ref="$EVENT_BEFORE_SHA"
          elif git rev-parse --verify origin/develop^{commit} >/dev/null 2>&1; then
            base_ref="origin/develop"
          else
            base_ref="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]]; then
            base_ref="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          if ! git cat-file -e "${base_ref}^{commit}"; then
            echo "::error::Não foi possível resolver a base para verificar alterações do frontend."
            exit 1
          fi
          if git diff --quiet "$base_ref" "$GITHUB_SHA" -- apps/frontend; then
            frontend_changed=false
          else
            frontend_changed=true
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "changed=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "Frontend changed against $base_ref: $frontend_changed"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Verify frontend API contract
        run: |
          node tools/Deployment/CheckFrontendApiContract.mjs
          node --test tools/Deployment/test_frontend_api_contract.mjs

      - name: Verify frontend compatibility with the target API
        if: steps.frontend-target.outputs.changed == 'true'
        env:
          BACKEND_COMPAT_REF: ${{ steps.frontend-target.outputs.base_ref }}
        run: |
          set -euo pipefail
          backend_ref="$BACKEND_COMPAT_REF"
          if [[ -z "$backend_ref" || "$backend_ref" =~ ^0+$ ]]; then
            backend_ref="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          node tools/Deployment/CheckFrontendApiContract.mjs --backend-ref "$backend_ref"

      - name: Audit dependencies
        if: steps.frontend-target.outputs.changed == 'true'
        working-directory: apps/frontend
        run: npm audit --audit-level=moderate

      - name: Check types
        if: steps.frontend-target.outputs.changed == 'true'
        working-directory: apps/frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        if: steps.frontend-target.outputs.changed == 'true'
        working-directory: apps/frontend
        run: npm run lint

      - name: Run tests
        if: steps.frontend-target.outputs.changed == 'true'
        working-directory: apps/frontend
        run: npm test

      - name: Install Playwright browsers
        if: steps.frontend-target.outputs.changed == 'true'
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests across Chromium, Firefox and WebKit
        if: steps.frontend-target.outputs.changed == 'true'
        working-directory: apps/frontend
        run: npm run test:e2e:cross-browser

      - name: Build for production
        if: steps.frontend-target.outputs.changed == 'true'
        working-directory: apps/frontend
        env:
          VITE_API_URL: https://api.vendmachine.com.br/api
          VITE_IS_TEST_ENVIRONMENT: "false"
        run: npm run build

      - name: Build frontend container without publishing
        if: steps.frontend-target.outputs.changed == 'true'
        run: >-
          docker build
          --build-arg VITE_API_URL=https://api.vendmachine.com.br/api
          --tag vend-machines-frontend:verify
          --file apps/frontend/Dockerfile
          apps/frontend

      - name: Verify frontend container user and health check
        if: steps.frontend-target.outputs.changed == 'true'
        run: |
          image_user="$(docker image inspect --format '{{.Config.User}}' vend-machines-frontend:verify)"
          runtime_uid="$(docker run --rm --entrypoint id vend-machines-frontend:verify -u)"
          if [ -z "$image_user" ] || [ "$image_user" = "0" ] || [ "$image_user" = "root" ] || [ "$runtime_uid" = "0" ]; then
            echo "::error::O container do frontend deve executar sem privilégios de root."
            exit 1
          fi

          container_name="vend-machines-frontend-health-${GITHUB_RUN_ID:-local}"
          docker run --detach --rm --name "$container_name" vend-machines-frontend:verify
          cleanup() { docker stop "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for _ in $(seq 1 20); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            if [ "$health" = "healthy" ]; then
              break
            fi
            if [ "$health" = "unhealthy" ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 2
          done
          if [ "$health" != "healthy" ]; then
            docker logs "$container_name"
            echo "::error::O health check do frontend não ficou healthy no prazo."
            exit 1
          fi

          headers="$(docker exec "$container_name" wget -S -O /dev/null http://127.0.0.1:8080/ 2>&1)"
          for expected_header in \
            'Strict-Transport-Security:[[:space:]]*max-age=31536000' \
            'X-Content-Type-Options:[[:space:]]*nosniff' \
            'X-Frame-Options:[[:space:]]*DENY' \
            'Content-Security-Policy:'; do
            if ! printf '%s\n' "$headers" | grep -Eiq "$expected_header"; then
              echo "$headers"
              echo "::error::Cabeçalho de segurança ausente no container do frontend: $expected_header"
              exit 1
            fi
          done

          echo "Container do frontend saudável como $image_user (UID $runtime_uid), com cabeçalhos de segurança."
