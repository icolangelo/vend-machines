server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://api.vendmachine.com.br wss://api.vendmachine.com.br" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
